<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Settings - Aasan Rozgaar</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }
    body {
        background: #f4f7f6;
        color: #222;
        padding-bottom: 40px;
    }
    .header {
        background: linear-gradient(135deg, #087f5b, #0aa36f);
        color: white;
        padding: 18px;
        text-align: center;
    }
    .header h1 {
        font-size: 22px;
    }
    .container {
        max-width: 650px;
        margin: 20px auto;
        padding: 0 15px;
    }
    .back {
        display: inline-block;
        background: #087f5b;
        color: white;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 14px;
    }
    .box {
        background: white;
        padding: 22px;
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }
    .box h2 {
        color: #087f5b;
        font-size: 18px;
        margin-bottom: 15px;
        border-bottom: 2px solid #e5f8ed;
        padding-bottom: 8px;
    }
    .form-group {
        margin-bottom: 14px;
    }
    label {
        display: block;
        font-weight: bold;
        font-size: 13px;
        color: #444;
        margin-bottom: 5px;
    }
    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
    }
    input:focus {
        border-color: #087f5b;
    }
    .btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        color: white;
        background: #087f5b;
        margin-top: 5px;
    }
    .btn-login-as {
        background: #17a2b8;
    }
    .btn:active {
        transform: scale(0.99);
    }
    .msg {
        margin-top: 10px;
        font-size: 13px;
        text-align: center;
        font-weight: bold;
    }
    .success { color: #087f5b; }
    .error { color: #d9534f; }
</style>
</head>
<body>

<div class="header">
    <h1>⚙️ Admin Control Settings</h1>
</div>

<div class="container">
    <a class="back" href="home.html">← Back to Dashboard</a>

    <!-- 1. Password Change Box -->
    <div class="box">
        <h2>Change User Password</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="passUsername" placeholder="Enter exact username">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="passPhone" placeholder="Enter user phone number">
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password">
        </div>
        <button class="btn" onclick="changeUserPassword()">Update Password</button>
        <div id="passMsg" class="msg"></div>
    </div>

    <!-- 2. Direct Login As User Box -->
    <div class="box">
        <h2>Direct Login As User</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="loginUsername" placeholder="Enter username to login">
        </div>
        <button class="btn btn-login-as" onclick="loginAsUser()">Login to User Account</button>
        <div id="loginMsg" class="msg"></div>
    </div>

</div>

<script>
const API_URL = "https://aasan-rozgaar-backend.onrender.com";

function getAdminToken() {
    return sessionStorage.getItem("adminSessionToken") || "";
}

if (!getAdminToken()) {
    window.location.href = "login.html";
}

// 1. Password Change Function
async function changeUserPassword() {
    const username = document.getElementById("passUsername").value.trim();
    const phone = document.getElementById("passPhone").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const msgDiv = document.getElementById("passMsg");

    if (!username || !phone || !newPassword) {
        msgDiv.className = "msg error";
        msgDiv.textContent = "Tamam fields lazmi bharein.";
        return;
    }

    const token = getAdminToken();
    const csrfToken = sessionStorage.getItem("adminCsrfToken") || "";

    try {
        const response = await fetch(API_URL + "/api/admin/users/password", {
            method: "PATCH",
            credentials: "include",
            headers: {
                "Authorization": "Bearer " + token,
                "X-CSRF-Token": csrfToken,
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({ username, phone, newPassword })
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.message || "Password update nahi ho saka.");
        }

        msgDiv.className = "msg success";
        msgDiv.textContent = "Password kamiyabi ke sath change ho gaya!";
        document.getElementById("passUsername").value = "";
        document.getElementById("passPhone").value = "";
        document.getElementById("newPassword").value = "";

    } catch (error) {
        msgDiv.className = "msg error";
        msgDiv.textContent = error.message || "Masla darpesh aaya.";
    }
}

// 2. Direct Login As User Function
async function loginAsUser() {
    const username = document.getElementById("loginUsername").value.trim();
    const msgDiv = document.getElementById("loginMsg");

    if (!username) {
        msgDiv.className = "msg error";
        msgDiv.textContent = "Username likhna lazmi hai.";
        return;
    }

    const token = getAdminToken();
    const csrfToken = sessionStorage.getItem("adminCsrfToken") || "";

    try {
        const response = await fetch(API_URL + "/api/admin/impersonate", {
            method: "POST",
            credentials: "include",
            headers: {
                "Authorization": "Bearer " + token,
                "X-CSRF-Token": csrfToken,
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({ username })
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.message || "Login fail ho gaya.");
        }

        // User session token save kar ke user side par redirect kar dein
        if (data.sessionToken) {
            localStorage.setItem("userSessionToken", data.sessionToken);
        }
        localStorage.setItem("username", username);

        msgDiv.className = "msg success";
        msgDiv.textContent = "Redirecting to user account...";

        setTimeout(() => {
            // User side ka main page ya dashboard URL yahan open ho jaye ga
            window.location.href = "https://nabihan814.github.io/aasan-rozgaar/home.html";
        }, 1000);

    } catch (error) {
        msgDiv.className = "msg error";
        msgDiv.textContent = error.message || "User login nahi ho saka.";
    }
}
</script>

</body>
</html>
