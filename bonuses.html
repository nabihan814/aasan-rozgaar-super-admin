<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bonuses - Admin</title><style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,sans-serif;
}

body{
 background:#f1f8f4;
 color:#222;
}

.header{
 background:linear-gradient(135deg,#087f3d,#12a854);
 color:white;
 padding:20px;
 text-align:center;
}

.header h1{
 font-size:24px;
}

.header p{
 margin-top:6px;
 opacity:.9;
}

.container{
 width:95%;
 max-width:1200px;
 margin:20px auto;
}

.back{
 display:inline-block;
 background:#087f3d;
 color:white;
 text-decoration:none;
 padding:10px 16px;
 border-radius:8px;
 margin-bottom:15px;
}

.cards{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px;
 margin-bottom:20px;
}

.card{
 background:white;
 border-radius:12px;
 padding:18px;
 box-shadow:0 3px 12px rgba(0,0,0,.08);
 text-align:center;
}

.card h3{
 color:#087f3d;
 margin-bottom:8px;
}

.card strong{
 font-size:22px;
}

.search{
 width:100%;
 padding:13px;
 border:1px solid #ccc;
 border-radius:8px;
 margin-bottom:15px;
 outline:none;
}

.search:focus{
 border-color:#087f3d;
}

.table-box{
 background:white;
 border-radius:12px;
 overflow:auto;
 box-shadow:0 3px 12px rgba(0,0,0,.08);
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:800px;
}

th{
 background:#087f3d;
 color:white;
 padding:12px;
 text-align:left;
}

td{
 padding:12px;
 border-bottom:1px solid #eee;
}

.btn{
 padding:6px 12px;
 border:0;
 border-radius:6px;
 font-weight:bold;
 cursor:pointer;
 font-size:12px;
 color:white;
 margin-right:4px;
}

.btn-approve{
 background:#087f3d;
}

.btn-reject{
 background:#d9534f;
}

.btn:active{
 transform:scale(0.97);
}

.empty{
 text-align:center;
 padding:30px;
 color:#777;
}

.error{
 background:#f8d7da;
 color:#842029;
 padding:15px;
 border-radius:8px;
 margin-bottom:15px;
}

@media(max-width:700px){
 .cards{
  grid-template-columns:1fr;
 }
 .header h1{
  font-size:21px;
 }
}
</style></head><body><div class="header">
 <h1>Bonus Management</h1>
 <p>Admin Panel</p>
</div><div class="container"><a href="home.html" class="back">
 ← Back to Home
</a><div class="cards"> <div class="card">
  <h3>Level 1</h3>
  <strong>10%</strong>
 </div> <div class="card">
  <h3>Level 2</h3>
  <strong>5%</strong>
 </div> <div class="card">
  <h3>Status</h3>
  <strong>Active</strong>
 </div></div><input
type="text"
id="search"
class="search"
placeholder="Search username / phone..."
oninput="renderUsers()"
>

<div id="message"></div><div class="table-box"><table><thead>
<tr>
 <th>S.No.</th>
 <th>User</th>
 <th>Phone</th>
 <th>Bonus Amount</th>
 <th>Action</th>
</tr>
</thead><tbody id="bonusTable"></tbody></table></div></div><script>

const API_URL = "https://aasan-rozgaar-backend.onrender.com";
let users = [];

function getAdminToken(){
 return sessionStorage.getItem("adminSessionToken");
}

async function loadUsers(){
 const token = getAdminToken();
 if(!token){
  window.location.href = "login.html";
  return;
 }

 try{
  const response = await fetch(API_URL + "/api/admin/users", {
   method: "GET",
   credentials: "include",
   headers: {
    "Authorization": "Bearer " + token,
    "Accept": "application/json"
   }
  });

  if(response.status === 401 || response.status === 403){
   sessionStorage.clear();
   window.location.href = "login.html";
   return;
  }

  if(!response.ok){
   throw new Error("Failed to load users");
  }

  const data = await response.json();
  users = Array.isArray(data.users) ? data.users : [];
  renderUsers();

 }catch(error){
  document.getElementById("message").innerHTML = `
   <div class="error">Users load nahi ho sake.</div>
  `;
 }
}

function renderUsers(){
 const tbody = document.getElementById("bonusTable");
 const search = document.getElementById("search").value.trim().toLowerCase();

 const filtered = users.filter(user=>{
  const username = String(user.username || "").toLowerCase();
  const phone = String(user.phone || "").toLowerCase();
  return username.includes(search) || phone.includes(search);
 });

 if(!filtered.length){
  tbody.innerHTML = `
   <tr>
    <td colspan="5" class="empty">No registered users found.</td>
   </tr>
  `;
  return;
 }

 tbody.innerHTML = filtered.map((user, index)=>{
  const username = user.username || "-";
  const phone = user.phone || "-";
  const bonusAmount = Number(user.bonusAmount || 0).toLocaleString("en-PK");

  return `
   <tr>
    <td>${index + 1}</td>
    <td><b>${escapeHtml(username)}</b></td>
    <td>${escapeHtml(phone)}</td>
    <td>Rs ${bonusAmount}</td>
    <td>
     <button class="btn btn-approve" onclick="handleBonus('${escapeHtml(username)}', 'approve')">Approve</button>
     <button class="btn btn-reject" onclick="handleBonus('${escapeHtml(username)}', 'reject')">Reject</button>
    </td>
   </tr>
  `;
 }).join("");
}

async function handleBonus(username, action){
 const token = getAdminToken();
 const csrfToken = sessionStorage.getItem("adminCsrfToken") || "";

 try {
  const response = await fetch(API_URL + "/api/admin/bonus/action", {
   method: "POST",
   credentials: "include",
   headers: {
    "Authorization": "Bearer " + token,
    "X-CSRF-Token": csrfToken,
    "Content-Type": "application/json",
    "Accept": "application/json"
   },
   body: JSON.stringify({
    username: username,
    action: action
   })
  });

  const data = await response.json();

  if(!response.ok || !data.success){
   throw new Error(data.message || "Action fail ho gaya.");
  }

  alert("Bonus successfully " + (action === 'approve' ? 'approved aur user ke balance mein transfer' : 'rejected') + " ho gaya!");
  loadUsers();

 } catch (error) {
  console.error("Bonus error:", error);
  alert(error.message || "Bonus process karne mein masla aaya.");
 }
}

function escapeHtml(value){
 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

loadUsers();
setInterval(loadUsers, 5000);
</script></body>
</html>
