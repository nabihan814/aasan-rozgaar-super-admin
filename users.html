<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Users - Aasan Rozgaar</title><style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f4f7f6;
 font-family:Arial,sans-serif;
}
.header{
 background:linear-gradient(135deg,#087f5b,#0aa36f);
 color:white;
 padding:18px;
}
.header h1{margin:0;font-size:22px}
.container{
 max-width:1000px;
 margin:auto;
 padding:15px;
}
.back{
 display:inline-block;
 background:#087f5b;
 color:white;
 text-decoration:none;
 padding:10px 15px;
 border-radius:8px;
 margin-bottom:15px;
}
.search{
 width:100%;
 padding:13px;
 border:1px solid #ccc;
 border-radius:8px;
 margin-bottom:15px;
 outline:none;
}
.search:focus{
 border-color:#087f5b;
}
.user{
 background:white;
 padding:17px;
 border-radius:12px;
 margin-bottom:12px;
 box-shadow:0 3px 10px rgba(0,0,0,.06);
}
.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
}
.name{
 font-weight:bold;
 color:#087f5b;
 font-size:17px;
}
.small{
 color:#777;
 font-size:13px;
 margin-top:4px;
}
.balance-text{
 font-weight:bold;
 color:#333;
 margin-top:4px;
}
.btn-group{
 display:flex;
 gap:6px;
 align-items:center;
 flex-wrap:wrap;
}
.btn{
 border:0;
 background:#087f5b;
 color:white;
 padding:8px 12px;
 border-radius:7px;
 cursor:pointer;
 font-size:13px;
}
.btn-danger{
 background:#d9534f;
}
.btn:active{
 transform:scale(.97);
}
.quick-balance-box{
 margin-top:10px;
 display:flex;
 gap:6px;
 background:#f9f9f9;
 padding:8px;
 border-radius:8px;
}
.quick-input{
 width:110px;
 padding:6px;
 border:1px solid #ddd;
 border-radius:6px;
 font-size:13px;
 outline:none;
}
.empty{
 background:white;
 padding:25px;
 text-align:center;
 color:#777;
 border-radius:12px;
}
</style></head><body><div class="header">
 <h1>👥 Users Management</h1>
</div><div class="container"><a class="back" href="home.html">← Back to Home</a>

<input
class="search"
id="search"
placeholder="Search username or phone..."
oninput="render()"
>

<div id="list"></div></div><script>

const API_URL="https://aasan-rozgaar-backend.onrender.com";

let allUsers=[];

function getAdminToken(){
 return sessionStorage.getItem("adminSessionToken") || "";
}

async function loadUsers(){

 const token=getAdminToken();

 if(!token){
  window.location.href="login.html";
  return;
 }

 try{

  const response=await fetch(
   API_URL+"/api/admin/users",
   {
    method:"GET",
    headers:{
     "Authorization":"Bearer "+token
    },
    credentials:"include"
   }
  );

  const data=await response.json();

  if(response.status===401 || response.status===403){
   sessionStorage.removeItem("adminSessionToken");
   sessionStorage.removeItem("adminCsrfToken");
   localStorage.removeItem("adminLoggedIn");
   localStorage.removeItem("adminUsername");
   window.location.href="login.html";
   return;
  }

  if(!response.ok || !data.success){
   throw new Error(data.message || "Unable to load users");
  }

  allUsers=Array.isArray(data.users) ? data.users : [];

  render();

 }catch(error){

  document.getElementById("list").innerHTML=
   '<div class="empty">'+
   escapeHtml(error.message || "Users load nahi ho sake.")+
   '</div>';
 }
}

function render(){

 const list=document.getElementById("list");

 const search=
  document.getElementById("search").value
   .trim()
   .toLowerCase();

 const users=allUsers.filter(u=>{

  const text=
   (u.username||"")+" "+
   (u.phone||"");

  return text.toLowerCase().includes(search);
 });

 if(!users.length){
  list.innerHTML=
   '<div class="empty">Abhi koi registered user nahi mila.</div>';
  return;
 }

 list.innerHTML=users.map(u=>{

  const username=u.username||"Unknown";
  const balance=Number(u.balance||0).toLocaleString("en-PK");

  const status=
   String(u.status||"Active").toLowerCase()==="blocked"
    ? "Blocked"
    : "Active";

  return `
   <div class="user">
    <div class="row">

     <div>
      <div class="name">${escapeHtml(username)}</div>
      <div class="small">Phone: ${escapeHtml(u.phone||"-")}</div>
      <div class="balance-text">Balance: Rs ${balance}</div>
      <div class="small">Status: ${escapeHtml(status)}</div>
     </div>

     <div class="btn-group">
      <button class="btn"
       onclick="openUser('${encodeURIComponent(username)}')">
       Details
      </button>
     </div>

    </div>

    <div class="quick-balance-box">
     <input type="number" id="amt_${escapeHtml(username)}" class="quick-input" placeholder="Amount" min="1">
     <button class="btn" onclick="modifyBalance('${escapeHtml(username)}', 'add')">+ Add</button>
     <button class="btn btn-danger" onclick="modifyBalance('${escapeHtml(username)}', 'deduct')">- Deduct</button>
    </div>

   </div>
  `;

 }).join("");
}

async function modifyBalance(username, action){
 const inputId = "amt_" + username;
 const amountVal = document.getElementById(inputId).value.trim();
 const amount = parseFloat(amountVal);

 if(!amountVal || isNaN(amount) || amount <= 0){
  alert("Baraye meherbani theek amount likhein.");
  return;
}

 const token = getAdminToken();
 const csrfToken = sessionStorage.getItem("adminCsrfToken") || "";

 try {
  const response = await fetch(API_URL + "/api/admin/users/" + encodeURIComponent(username) + "/balance", {
   method: "PATCH",
   credentials: "include",
   headers: {
    "Authorization": "Bearer " + token,
    "X-CSRF-Token": csrfToken,
    "Content-Type": "application/json",
    "Accept": "application/json"
   },
   body: JSON.stringify({
    action: action,
    amount: amount
   })
  });

  const data = await response.json();

  if(!response.ok || !data.success){
   throw new Error(data.message || "Balance update nahi ho saka.");
  }

  alert("Balance kamiyabi ke sath update ho gaya!");
  loadUsers();

 } catch (error) {
  console.error("Balance update error:", error);
  alert(error.message || "Balance update karne mein masla aaya.");
 }
}

function openUser(username){

 localStorage.setItem(
  "adminSelectedUser",
  decodeURIComponent(username)
 );

 window.location.href="user-details.html";
}

function escapeHtml(value){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

loadUsers();

</script></body>
</html>
