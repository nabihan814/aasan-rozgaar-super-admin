</style></head><body><div class="header">
 <h1>👥 Users</h1>

<input
class="search"
id="search"
placeholder="Search username, phone or email..."
oninput="render()"

«»

<div id="list"></div></div><script>

const API_URL="https://aasan-rozgaar-backend.onrender.com";

let allUsers=[];

function getAdminToken(){
 return sessionStorage.getItem("adminSessionToken") || "";
}

async function loadUsers(){

 const token=getAdminToken();

 if(!token){
  window.location.href="login.html";
  return;
 }

 try{

  const response=await fetch(
   API_URL+"/api/admin/users",
   {
    method:"GET",
    headers:{
     "Authorization":"Bearer "+token
    },
    credentials:"include"
   }
  );

  const data=await response.json();

  if(response.status===401 || response.status===403){
   sessionStorage.removeItem("adminSessionToken");
   sessionStorage.removeItem("adminCsrfToken");
   localStorage.removeItem("adminLoggedIn");
   localStorage.removeItem("adminUsername");
   window.location.href="login.html";
   return;
  }

  if(!response.ok || !data.success){
   throw new Error(data.message || "Unable to load users");
  }

  allUsers=Array.isArray(data.users) ? data.users : [];

  render();

 }catch(error){

  document.getElementById("list").innerHTML=
   '<div class="empty">'+
   escapeHtml(error.message || "Users load nahi ho sake.")+
   '</div>';
 }
}

function render(){

 const list=document.getElementById("list");

 const search=
  document.getElementById("search").value
   .trim()
   .toLowerCase();

 const users=allUsers.filter(u=>{

  const text=
   (u.username||"")+" "+
   (u.phone||"");

  return text.toLowerCase().includes(search);
 });

 if(!users.length){
  list.innerHTML=
   '<div class="empty">Abhi koi registered user nahi mila.</div>';
  return;
 }

 list.innerHTML=users.map(u=>{

  const username=u.username||"Unknown";

  const status=
   String(u.status||"Active").toLowerCase()==="blocked"
    ? "Blocked"
    : "Active";

  return `
   <div class="user">
    <div class="row">

     <div>
      <div class="name">${escapeHtml(username)}</div>
      <div class="small">Phone: ${escapeHtml(u.phone||"-")}</div>
      <div class="small">Status: ${escapeHtml(status)}</div>
     </div>

     <div>
      <button class="btn"
       onclick="openUser('${encodeURIComponent(username)}')">
       View Details
      </button>
     </div>

    </div>
   </div>
  `;

 }).join("");
}

function openUser(username){

 localStorage.setItem(
  "adminSelectedUser",
  decodeURIComponent(username)
 );

 window.location.href="user-details.html";
}

function escapeHtml(value){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

loadUsers();

setInterval(loadUsers,5000);

</script></body>
</html>
