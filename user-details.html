<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Users - Aasan Rozgaar Admin</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }
    body {
        background: #f4f7f6;
        color: #222;
        padding-bottom: 40px;
    }
    .header {
        background: linear-gradient(135deg, #087f5b, #0aa36f);
        color: white;
        padding: 18px;
        text-align: center;
    }
    .header h1 {
        font-size: 22px;
    }
    .container {
        max-width: 900px;
        margin: 15px auto;
        padding: 0 15px;
    }
    .back {
        display: inline-block;
        background: #087f5b;
        color: white;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 14px;
    }
    .search-box {
        margin-bottom: 15px;
    }
    .search-box input {
        width: 100%;
        padding: 14px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
    }
    .search-box input:focus {
        border-color: #087f5b;
    }
    .user-card {
        background: white;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: transform 0.1s ease;
    }
    .user-card:active {
        transform: scale(0.99);
    }
    .user-info h3 {
        color: #087f5b;
        font-size: 17px;
        margin-bottom: 4px;
    }
    .user-info p {
        color: #666;
        font-size: 13px;
        margin: 2px 0;
    }
    .user-status {
        text-align: right;
    }
    .badge {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: bold;
    }
    .badge-active {
        background: #e5f8ed;
        color: #087f5b;
    }
    .badge-blocked {
        background: #ffe7e7;
        color: #c62828;
    }
    .message {
        text-align: center;
        color: #777;
        padding: 30px;
        background: white;
        border-radius: 12px;
    }
</style>
</head>
<body>

<div class="header">
    <h1>👥 Registered Users</h1>
</div>

<div class="container">
    <a class="back" href="home.html">← Back to Dashboard</a>

    <!-- Search Bar -->
    <div class="search-box">
        <input 
            type="text" 
            id="searchInput" 
            placeholder="Search by username or phone number..." 
            onkeyup="filterUsers()"
        >
    </div>

    <!-- Users List Container -->
    <div id="usersList">
        <div class="message">Loading users...</div>
    </div>
</div>

<script>
const API_URL = "https://aasan-rozgaar-backend.onrender.com";
const token = sessionStorage.getItem("adminSessionToken");

if (!token) {
    window.location.href = "login.html";
}

let allUsersData = [];

async function fetchUsers() {
    const listContainer = document.getElementById("usersList");

    try {
        const response = await fetch(API_URL + "/api/admin/users", {
            method: "GET",
            credentials: "include",
            headers: {
                "Authorization": "Bearer " + token,
                "Accept": "application/json"
            }
        });

        if (response.status === 401 || response.status === 403) {
            sessionStorage.clear();
            window.location.href = "login.html";
            return;
        }

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Users load nahi ho sake.");
        }

        allUsersData = Array.isArray(data.users) ? data.users : [];
        renderUsers(allUsersData);

    } catch (error) {
        console.error("Error fetching users:", error);
        listContainer.innerHTML = `
            <div class="message" style="color: #c62828;">
                ${escapeHtml(error.message || "Users load karne mein masla aaya.")}
            </div>
        `;
    }
}

function renderUsers(users) {
    const listContainer = document.getElementById("usersList");

    if (users.length === 0) {
        listContainer.innerHTML = `<div class="message">Koi user nahi mila.</div>`;
        return;
    }

    let html = "";
    users.forEach(user => {
        const username = user.username || "Unknown";
        const phone = user.phone || "-";
        const balance = Number(user.balance || 0).toLocaleString("en-PK");
        const isBlocked = String(user.status || "").toLowerCase() === "blocked";
        const statusText = isBlocked ? "Blocked" : "Active";
        const statusClass = isBlocked ? "badge-blocked" : "badge-active";

        html += `
            <div class="user-card" onclick="viewUserDetails('${escapeHtml(username)}')">
                <div class="user-info">
                    <h3>${escapeHtml(username)}</h3>
                    <p>📞 ${escapeHtml(phone)}</p>
                    <p>💰 Balance: Rs ${balance}</p>
                </div>
                <div class="user-status">
                    <span class="badge ${statusClass}">${statusText}</span>
                </div>
            </div>
        `;
    });

    listContainer.innerHTML = html;
}

function filterUsers() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    
    const filtered = allUsersData.filter(user => {
        const username = String(user.username || "").toLowerCase();
        const phone = String(user.phone || "").toLowerCase();
        return username.includes(query) || phone.includes(query);
    });

    renderUsers(filtered);
}

function viewUserDetails(username) {
    localStorage.setItem("adminSelectedUser", username);
    window.location.href = "user-details.html";
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

fetchUsers();
</script>

</body>
</html>
